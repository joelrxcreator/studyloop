<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Studyloop</title>
  <meta name="description" content="Studyloop – behalte im Blick, was du im Studium nachholen musst. Stundenplan, Fortschritt pro Termin, Lern-Cockpit und Prüfungs-Countdown.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Studyloop">
  <meta name="theme-color" content="#0a0f1a">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png?v=2">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Farbschema vor dem ersten Zeichnen setzen (kein Aufblitzen)
    (function () {
      try {
        var t = localStorage.getItem('sl.theme') || 'auto';
        if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#000000' : '#f2f2f7');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">Studyloop braucht JavaScript.</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
